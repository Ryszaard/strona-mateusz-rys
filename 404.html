<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nie znaleziono strony – Mateusz Ryś</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:#0b0d17;color:#eef0f8;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;pointer-events:none}
.b1{width:480px;height:480px;background:#7c5cff;top:-160px;left:-160px}
.b2{width:420px;height:420px;background:#22d3ee;opacity:.25;bottom:-160px;right:-140px}
main{position:relative;max-width:520px}
.code{font-family:Sora,sans-serif;font-weight:800;font-size:clamp(90px,22vw,160px);line-height:1;letter-spacing:-.04em;background:linear-gradient(120deg,#8f74ff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:Sora,sans-serif;font-size:26px;margin:18px 0 10px}
p{color:#9aa1bd;font-size:16px;line-height:1.6}
a.btn{display:inline-block;margin-top:28px;padding:14px 26px;border-radius:999px;background:linear-gradient(120deg,#7c5cff,#22d3ee);color:#fff;font-weight:600;text-decoration:none}
html[lang=pl] .en, html[lang=en] .pl{display:none}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <div class="code">404</div>
  <div class="pl"><h1>Nie ma takiej strony</h1><p>Ten adres nie istnieje albo został zmieniony. Wróć na stronę główną – tam znajdziesz ofertę, cennik i formularz.</p><a class="btn" href="/">← Strona główna</a></div>
  <div class="en"><h1>Page not found</h1><p>This address doesn't exist or has changed. Go back to the homepage to see my services, pricing and order form.</p><a class="btn" href="/">← Homepage</a></div>
</main>
<script>
(function(){var l='pl';try{l=localStorage.getItem('lang')||((navigator.language||'pl').toLowerCase().indexOf('pl')===0?'pl':'en')}catch(e){}document.documentElement.lang=l;if(l==='en')document.title='Page not found – Mateusz Ryś';})();
</script>
</body>
</html>
